<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title description">
  <title id="title">Inputs for a hypothetical detector population</title>
  <desc id="description">Of 1,000 cases, 20 have an authored malicious label and 980 a benign label. Assume recall 60 percent and false-positive rate 5 percent. No flag counts or precision are shown.</desc>
  <rect width="640" height="360" fill="#fff7fa"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#272c38" font-size="30">
    <text x="320" y="42">Assumed population: 1,000 cases</text>
    <rect x="48" y="64" width="544" height="108" rx="8" fill="#f9dbe7" stroke="#903252" stroke-width="3"/>
    <text x="320" y="108">Malicious label: 20</text>
    <text x="320" y="150">Assumed recall: 60%</text>
    <rect x="48" y="192" width="544" height="108" rx="8" fill="#dfeaf9" stroke="#28538a" stroke-width="3"/>
    <text x="320" y="236">Benign label: 980</text>
    <text x="320" y="278">Assumed false-positive rate: 5%</text>
    <text x="320" y="339">Conditional rates held fixed</text>
  </g>
</svg>
