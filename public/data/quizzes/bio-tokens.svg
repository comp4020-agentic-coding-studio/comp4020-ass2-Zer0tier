<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-labelledby="title description">
  <title id="title">Four unmarked token positions</title>
  <desc id="description">Position 0 is partner, position 1 is in, position 2 is crime, and position 3 is tonight. Find the exact dictionary matches and count distinct covered positions.</desc>
  <rect width="640" height="240" fill="#fff7fa"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#272c38">
    <text x="320" y="42" font-size="30">Tokenizer output</text>
    <g fill="#dfeaf9" stroke="#28538a" stroke-width="2">
      <rect x="16" y="66" width="140" height="112" rx="8"/>
      <rect x="172" y="66" width="140" height="112" rx="8"/>
      <rect x="328" y="66" width="140" height="112" rx="8"/>
      <rect x="484" y="66" width="140" height="112" rx="8"/>
    </g>
    <g font-size="30">
      <text x="86" y="111">0</text><text x="86" y="152">partner</text>
      <text x="242" y="111">1</text><text x="242" y="152">in</text>
      <text x="398" y="111">2</text><text x="398" y="152">crime</text>
      <text x="554" y="111">3</text><text x="554" y="152">tonight</text>
    </g>
    <text x="320" y="219" font-size="27">Each position counts at most once</text>
  </g>
</svg>
