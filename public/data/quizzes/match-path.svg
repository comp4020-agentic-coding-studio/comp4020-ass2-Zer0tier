<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title description">
  <title id="title">The mutual-selection path</title>
  <desc id="description">A selects with probability 0.40. The next required event is B selecting given A, with conditional probability 0.30. No joint result is shown.</desc>
  <rect width="640" height="360" fill="#fff7fa"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#272c38" font-size="30">
    <text x="320" y="42">One eligible pair · both events required</text>
    <rect x="64" y="64" width="512" height="102" rx="8" fill="#dfeaf9" stroke="#28538a" stroke-width="3"/>
    <text x="320" y="105">A selects</text>
    <text x="320" y="145">P(A) = 0.40</text>
    <path d="M320 173 V206 M309 196 L320 207 L331 196" fill="none" stroke="#28538a" stroke-width="4"/>
    <rect x="64" y="216" width="512" height="102" rx="8" fill="#f9dbe7" stroke="#903252" stroke-width="3"/>
    <text x="320" y="257">B selects, given A</text>
    <text x="320" y="297">P(B | A) = 0.30</text>
    <text x="320" y="348" font-size="25">The second rate uses the A branch</text>
  </g>
</svg>
