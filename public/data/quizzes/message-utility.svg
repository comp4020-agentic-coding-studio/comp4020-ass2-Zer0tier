<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title description">
  <title id="title">Inputs for two admissible drafts</title>
  <desc id="description">Plain has assumed reply probability 0.30 and composition time 10 seconds. Context has assumed probability 0.45 and time 20 seconds. A reply contributes 10 utility units; defer has utility zero. The crossover is not supplied.</desc>
  <rect width="640" height="360" fill="#fff7fa"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#272c38" font-size="30">
    <text x="320" y="42">Assumed inputs · admissible drafts</text>
    <rect x="48" y="64" width="544" height="108" rx="8" fill="#dfeaf9" stroke="#28538a" stroke-width="3"/>
    <text x="320" y="108">Plain</text>
    <text x="320" y="150">p = 0.30 · t = 10 seconds</text>
    <rect x="48" y="192" width="544" height="108" rx="8" fill="#f9dbe7" stroke="#903252" stroke-width="3"/>
    <text x="320" y="236">Context</text>
    <text x="320" y="278">p = 0.45 · t = 20 seconds</text>
    <text x="320" y="339" font-size="27">V = 10 units per reply · defer = 0 units</text>
  </g>
</svg>
