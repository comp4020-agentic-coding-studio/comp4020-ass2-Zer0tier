<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="title description">
  <title id="title">Source rectangle and proposed crop</title>
  <desc id="description">An 800 by 600 source. A 400 by 300 crop starts at coordinates 200, 100 and lies inside the source. The drawing is a geometric teaching fixture.</desc>
  <rect width="640" height="480" fill="#fff7fa"/>
  <g font-family="Arial, sans-serif" font-size="30" fill="#272c38">
    <text x="320" y="39" text-anchor="middle">Source: 800 × 600</text>
    <rect x="80" y="65" width="480" height="360" rx="2" fill="#dfeaf9" stroke="#28538a" stroke-width="4"/>
    <rect x="200" y="125" width="240" height="180" fill="#f9dbe7" stroke="#903252" stroke-width="4" stroke-dasharray="10 6"/>
    <text x="320" y="202" text-anchor="middle">Crop</text>
    <text x="320" y="247" text-anchor="middle">400 × 300</text>
    <text x="98" y="107">(0, 0)</text>
    <circle cx="200" cy="125" r="6" fill="#903252"/>
    <path d="M200 125 L200 348 L420 348" fill="none" stroke="#903252" stroke-width="2"/>
    <text x="320" y="390" text-anchor="middle">Start: (200, 100)</text>
    <text x="320" y="464" text-anchor="middle">Shaded area = retained crop</text>
  </g>
</svg>
